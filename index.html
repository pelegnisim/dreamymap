<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Dreamy by Peleg — קרוון בישראל</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d1117;display:flex;justify-content:center;align-items:center;height:100svh;overflow:hidden;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
    #gameWrapper{position:relative;display:inline-block;max-width:100%;overflow:hidden}
    canvas{display:block;border:2px solid #30a0ff;border-radius:10px;box-shadow:0 0 40px rgba(48,160,255,.3);cursor:crosshair;max-width:100vw;max-height:100svh;width:auto;height:auto;touch-action:none}

    #modal{
      display:none;position:absolute;
      left:33.75%;top:50%;transform:translate(-50%,-50%);
      background:linear-gradient(135deg,#0d1b3e,#1a2a50);
      border:2px solid #30a0ff;border-radius:16px;
      padding:22px 20px;width:min(340px, calc(100vw - 20px));
      max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;
      color:#fff;z-index:100;direction:rtl;
      box-shadow:0 0 50px rgba(48,160,255,.5),inset 0 0 20px rgba(48,160,255,.08)
    }
    .m-emoji{font-size:38px;display:block;text-align:center;margin-bottom:2px}
    .m-title{font-size:21px;font-weight:bold;color:#ffd700;text-align:center;margin-bottom:3px}
    .m-sub{font-size:12px;color:#8899bb;text-align:center;margin-bottom:12px}
    .attr-btn{
      display:block;width:100%;padding:9px 13px;margin:5px 0;
      background:rgba(48,160,255,.12);border:1px solid rgba(48,160,255,.45);
      border-radius:10px;color:#fff;font-size:13px;cursor:pointer;
      transition:all .15s;text-align:right;direction:rtl
    }
    .attr-btn:hover{background:rgba(48,160,255,.3);border-color:#30a0ff;transform:translateX(-2px)}
    .attr-pts{color:#ffd700;font-weight:bold;float:left;font-size:12px}
    .attr-done{
      padding:8px 13px;margin:5px 0;
      background:rgba(0,200,80,.08);border:1px solid #2a5a3a;
      border-radius:10px;color:#4a8a5a;font-size:13px;text-align:right;
      direction:rtl;opacity:0.7
    }
    .skip-btn{
      display:block;width:100%;padding:7px;margin-top:10px;
      background:transparent;border:1px solid #223;
      border-radius:8px;color:#556;font-size:12px;cursor:pointer;transition:all .15s
    }
    .skip-btn:hover{color:#aaa;border-color:#556}

    #cityPhoto{position:relative;margin:-8px -6px 10px;height:130px;border-radius:12px;overflow:hidden;
      background:linear-gradient(110deg,#16264a 30%,#203660 50%,#16264a 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
    #cityPhoto.loaded{animation:none;background:#0d1b3e}
    #cityPhoto img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
    #cityPhoto.loaded img{opacity:1}
    #cityPhoto a{position:absolute;bottom:4px;left:6px;font-size:9px;color:rgba(255,255,255,.75);text-decoration:none;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px}
    @keyframes shimmer{to{background-position:-200% 0}}
    #cityTips{margin-top:10px;background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:8px 12px}
    #cityTips summary{cursor:pointer;color:#ffd700;font-size:13px;font-weight:bold;list-style:none}
    #cityTips summary::-webkit-details-marker{display:none}
    #cityTips summary::after{content:' ▾';color:#b8a040}
    #cityTips[open] summary::after{content:' ▴'}
    #cityTipsList{margin:8px 0 2px;padding:0;list-style:none}
    #cityTipsList li{font-size:12.5px;color:#d0e8ff;line-height:1.5;margin:6px 0}

    #triviaAttrName{font-size:13px;color:#88aacc;text-align:center;margin-bottom:10px;font-weight:bold}
    #triviaTimerBar{width:100%;height:11px;background:#111827;border-radius:6px;overflow:hidden;margin-bottom:3px}
    #triviaTimerFill{height:100%;width:100%;background:#4caf50;border-radius:6px}
    #triviaTimeNum{font-size:11px;color:#8899bb;text-align:center;margin-bottom:14px}
    #triviaQ{font-size:15px;font-weight:bold;color:#fff;margin-bottom:16px;text-align:center;line-height:1.45}
    .t-opt{
      display:block;width:100%;padding:9px 13px;margin:5px 0;
      background:rgba(255,255,255,.07);border:1px solid #334;
      border-radius:10px;color:#ccc;font-size:13px;cursor:pointer;
      transition:all .15s;text-align:center
    }
    .t-opt:hover{background:rgba(255,255,255,.15);border-color:#667}
    .t-opt.correct{background:rgba(76,175,80,.35)!important;border-color:#4caf50!important;color:#fff!important}
    .t-opt.wrong  {background:rgba(244,67,54,.35)!important;border-color:#f44336!important;color:#fff!important}

    #resultIcon{font-size:50px;text-align:center;margin-bottom:6px}
    #resultText{font-size:19px;font-weight:bold;text-align:center;margin-bottom:5px}
    #resultPts{font-size:13px;color:#aaa;text-align:center;margin-bottom:16px;line-height:1.4}
    #resultBtn{
      display:block;width:100%;padding:12px;
      background:linear-gradient(135deg,#1a5496,#30a0ff);
      border:none;border-radius:10px;
      color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:transform .15s
    }
    #resultBtn:hover{transform:scale(1.02)}

    #victory{
      display:none;position:absolute;top:0;left:0;
      width:100%;height:100%;
      background:rgba(5,10,30,0.93);
      flex-direction:column;align-items:center;justify-content:center;
      z-index:200;border-radius:10px;direction:rtl;text-align:center;
      padding:30px
    }
    #victoryReplay{
      padding:14px 36px;
      background:linear-gradient(135deg,#1a5496,#30a0ff);
      border:none;border-radius:12px;
      color:#fff;font-size:18px;font-weight:bold;cursor:pointer;
      transition:transform .15s;margin-top:6px
    }
    #victoryReplay:hover{transform:scale(1.05)}
    #victoryShare{padding:10px 28px;background:transparent;border:2px solid #30a0ff;border-radius:12px;color:#30a0ff;font-size:15px;cursor:pointer;transition:all .15s;margin-top:8px}
    #victoryShare:hover{background:rgba(48,160,255,.15);transform:scale(1.03)}
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="canvas" width="800" height="620"></canvas>
  <div id="victory">
    <div style="font-size:64px;margin-bottom:8px">🇮🇱 🎉 🚐</div>
    <div style="font-size:26px;font-weight:bold;color:#ffd700;margin-bottom:12px">סיימתם לטייל במדינת ישראל!</div>
    <div id="victoryScore" style="font-size:72px;font-weight:bold;color:#30a0ff;line-height:1"></div>
    <div style="font-size:13px;color:#8899bb;margin-bottom:10px">נקודות</div>
    <div id="victoryAttrs" style="font-size:15px;color:#fff;margin-bottom:6px"></div>
    <div id="victoryHigh" style="font-size:14px;color:#ffd700;margin-bottom:22px"></div>
    <button id="victoryReplay">שחקו שוב 🔄</button>
    <button id="victoryShare">שתפו ניקוד 📤</button>
  </div>
  <div id="modal">
    <div id="screenCity">
      <div id="cityPhoto"><img id="cityImg" alt=""><a id="cityImgCredit" target="_blank" rel="noopener">צילום: ויקיפדיה</a></div>
      <span class="m-emoji" id="modEmoji"></span>
      <div class="m-title" id="modTitle"></div>
      <div class="m-sub">בחרו אטרקציה לביקור:</div>
      <div id="modAttractions"></div>
      <details id="cityTips"><summary>💡 טיפים מהדרך של פלג</summary><ul id="cityTipsList"></ul></details>
      <button class="skip-btn" id="skipBtn">אולי אחר כך... 👋</button>
    </div>
    <div id="screenTrivia" style="display:none">
      <div id="triviaAttrName"></div>
      <div id="triviaTimerBar"><div id="triviaTimerFill"></div></div>
      <div id="triviaTimeNum">20 שניות</div>
      <div id="triviaQ"></div>
      <div id="triviaOptions"></div>
    </div>
    <div id="screenExplanation" style="display:none">
      <div id="expIcon" style="font-size:40px;text-align:center;margin-bottom:6px"></div>
      <div id="expTitle" style="font-size:15px;font-weight:bold;text-align:center;margin-bottom:10px;color:#ffd700"></div>
      <div id="expText" style="font-size:13px;color:#d0e8ff;line-height:1.65;text-align:right;margin-bottom:18px;direction:rtl;background:rgba(48,160,255,.07);border-radius:10px;padding:12px"></div>
      <button id="expBtn" style="display:block;width:100%;padding:11px;background:linear-gradient(135deg,#1a5496,#30a0ff);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer">הבנתי! 👍</button>
    </div>
    <div id="screenResult" style="display:none">
      <div id="resultIcon"></div>
      <div id="resultText"></div>
      <div id="resultPts"></div>
      <button id="resultBtn">המשיכו לטייל! 🚐</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const W = 800, H = 620, MAP_W = 540;
const PANEL_X = 545, PANEL_W = 255;
const MX = 155, MY = 30;
const PORTRAIT_PANEL_H = 200;

const caravanImg = new Image();
caravanImg.src = 'Dreamy_Sticker-removebg-preview.png';

const ISRAEL = [
  [62,0],[140,6],[172,42],[178,108],
  [162,152],[178,202],[184,252],[190,302],
  [194,356],[176,402],[158,458],[152,502],
  [146,526],[132,530],[108,524],[78,468],
  [53,412],[23,358],[8,312],[4,262],
  [4,208],[11,152],[21,98],[28,62],
  [40,28],[62,0],
];

// ═══════════════════════════════════════════════════════════════
// CITIES + ATTRACTIONS + TRIVIA
// ═══════════════════════════════════════════════════════════════
const CITIES = [
  {
    name:'ראש הניקרה', emoji:'🌊', mx:36, my:18, color:'#80cbc4',
    wiki:['Rosh HaNikra grottoes','Rosh HaNikra'],
    tips:[
      '📍 גן לאומי אכזיב, כמה דקות דרומה: בריכות טבע בתוך סלעי החוף, מושלם לשנורקל רגוע בקיץ',
      '🌅 השקיעה מהמצוק היא מהיפות בצפון. תגיעו שעה לפני הסגירה',
      '🌊 ביום של ים סוער הגלים בנקרות פשוט מטורפים, שווה לבוא דווקא אז',
    ],
    attractions:[
      { name:'המנהרות', pts:20, trivia:[
        {q:`איך נוצרו הנקרות (המערות) של ראש הניקרה?`, opts:[`גלי הים שחקו את סלע הגיר הרך`,`חציבה של פועלים בתקופה הרומית`,`זרם לבה מהתפרצות געשית`], a:0,
         exp:`הים חדר לסדקים בסלע הגיר הרך, וגל אחרי גל, במשך אלפי שנים, שחק אותו ויצר מערות ומעברים באורך כולל של כ-200 מטר. הצבע הטורקיז של המים בפנים נובע מהאור שחודר דרך המים הרדודים.`},
        {q:`מי חצב את מנהרת הרכבת בראש הניקרה?`, opts:[`הצבא הבריטי, במלחמת העולם השנייה`,`האימפריה העות'מאנית`,`מדינת ישראל, בשנות ה-60`], a:0,
         exp:`בזמן מלחמת העולם השנייה הבריטים סללו מסילה שחיברה את חיפה לביירות ולטריפולי, וחצבו מנהרה דרך המצוק. ב-1948 פוצצו לוחמי ההגנה את גשרי המסילה כדי למנוע שימוש בה. את המנהרה אפשר לראות גם היום.`},
      ]},
      { name:'פארק החוף', pts:15, trivia:[
        {q:`ראש הניקרה שוכנת על הגבול עם איזו מדינה?`, opts:[`לבנון`,`סוריה`,`ירדן`], a:0,
         exp:`ראש הניקרה היא הנקודה הצפון-מערבית של ישראל, ומעבר הגדר כבר לבנון. מעבר הגבול כאן סגור, ומשמש בעיקר את כוחות האו"ם.`},
        {q:`במה ידוע הרכבל של ראש הניקרה?`, opts:[`הוא מהתלולים בעולם`,`הוא הארוך בישראל`,`הוא עובר מעל הים לקפריסין`], a:0,
         exp:`הרכבל יורד מראש המצוק אל הנקרות בשיפוע של כ-60 מעלות, ומוצג כאחד הרכבלים התלולים בעולם. הנסיעה קצרה, אבל הנוף לים ולמצוק הלבן שווה כל שנייה.`},
      ]},
      { name:"ג'יפים בגבול", pts:25, trivia:[
        {q:`רכס ראש הניקרה הוא חלק מרכס גדול יותר. איך קוראים לו?`, opts:[`סולמות צור`,`רכס הכרמל`,`רכס מירון`], a:0,
         exp:`"סולמות צור" הוא רכס הגיר שמתחיל בראש הניקרה ונמשך צפונה לתוך לבנון, לכיוון העיר צור. כבר בעת העתיקה זה היה מעבר צר וקשה לאורך החוף, בין הים למצוק.`},
        {q:`איזה גן לאומי עם בריכות טבע שוכן כמה קילומטרים דרומית לראש הניקרה?`, opts:[`אכזיב`,`בית גוברין`,`קיסריה`], a:0,
         exp:`גן לאומי אכזיב שוכן על חוף הים בין נהריה לראש הניקרה. יש בו מדשאות, שרידי יישוב עתיק ובריכות טבע רדודות בתוך סלעי החוף.`},
      ]},
    ]
  },
  {
    name:'עכו', emoji:'🏰', mx:16, my:73, color:'#bcaaa4',
    wiki:['Acre, Israel','Old City of Acre'],
    tips:[
      '🍽️ חומוס בעיר העתיקה ודגים טריים בנמל הדייגים. עכו היא עיר של אוכל',
      '🚶 טיילת החומות על הים, בשקיעה. חינם ומהממת',
      '📍 גני הבהאים בבהג\'י, ממש בכניסה לעיר: הגן הכי שקט שתמצאו בצפון',
    ],
    attractions:[
      { name:'העיר העתיקה', pts:25, trivia:[
        {q:`באיזו שנה הטיל נפוליאון מצור על עכו?`, opts:[`1799`,`1812`,`1776`], a:0,
         exp:`ב-1799 נפוליאון צר על עכו כחודשיים ולא הצליח לכבוש אותה. המושל אחמד אל-ג'זאר הגן על העיר בעזרת הצי הבריטי. הכישלון הזה עצר את המסע של נפוליאון במזרח, והוא חזר למצרים.`},
        {q:`מי היה המושל שהגן על עכו מול נפוליאון?`, opts:[`אחמד אל-ג'זאר`,`דאהר אל-עמר`,`סולימאן המפואר`], a:0,
         exp:`אחמד אל-ג'זאר שלט בעכו בסוף המאה ה-18 וביצר אותה בחומות חזקות. הכינוי "ג'זאר" פירושו "הקצב", בגלל האכזריות שלו. הוא גם בנה את המסגד הירוק הגדול שרואים מכל העיר.`},
        {q:`באיזו שנה הוכרזה העיר העתיקה של עכו כאתר מורשת עולמית?`, opts:[`2001`,`1985`,`2015`], a:0,
         exp:`אונסק"ו הכריזה על העיר העתיקה של עכו כאתר מורשת עולמית ב-2001. העיר הצלבנית שמתחת לאדמה נשמרה כמעט שלמה, כי העות'מאנים בנו את העיר שלהם ממש מעליה.`},
      ]},
      { name:'שוק עכו', pts:15, trivia:[
        {q:`מה פירוש השם "חאן אל-עומדאן" בעכו?`, opts:[`חאן העמודים`,`חאן הסוחרים`,`חאן המגדל`], a:0,
         exp:`"חאן אל-עומדאן" הוא חאן העמודים: אכסניה גדולה לסוחרים ולגמלים שלהם, שבנה אל-ג'זאר בסוף המאה ה-18. העמודים שבחצר הובאו, לפי המסורת, משרידי קיסריה. מגדל השעון מעל השער נוסף בתחילת המאה ה-20.`},

      ]},
      { name:'מנהרות הצלבנים', pts:20, trivia:[
        {q:`מי חפר את המנהרה שחיברה את המבצר הצלבני לנמל של עכו?`, opts:[`אבירי המקדש (הטמפלרים)`,`הרומאים`,`העות'מאנים`], a:0,

        {q:`באיזו שנה נפלה עכו הצלבנית לידי הממלוכים?`, opts:[`1291`,`1099`,`1517`], a:0,
         exp:`ב-1291 כבשו הממלוכים את עכו, המעוז הגדול האחרון של הצלבנים בארץ. הנפילה שלה סימנה את סוף ממלכת הצלבנים. את אולמות האבירים הענקיים אפשר לראות היום מתחת לעיר.`},
      ]},
    ]
  },
  {
    name:'חיפה', emoji:'⛵', mx:22, my:98, color:'#4fc3f7',
    wiki:["Bahá'í Gardens",'Haifa'],
    tips:[
      '📍 המושבה הגרמנית בתחתית הגנים: שדרה יפה עם בתי אבן ומסעדות',
      '🚇 הכרמלית עולה מהעיר התחתית למרכז הכרמל, דרך כיפית לחסוך עליות',
      '🌄 טיילת לואי במרכז הכרמל: התצפית הכי טובה על המפרץ, במיוחד בלילה',
    ],
    attractions:[
      { name:'גני בהאי', pts:20, trivia:[
        {q:`כמה טרסות (מדרגות גנים) יש בגנים הבהאים על הכרמל?`, opts:[`19`,`9`,`29`], a:0,

let audioCtx = null, melodyTimeout = null, melodySources = [];

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return; }
  // iOS: must resume() synchronously within gesture handler, THEN play sound
  if (audioCtx.resume) audioCtx.resume();
  try {
    // Play near-silent tone to confirm unlock (works better than empty buffer on iOS)
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(0); osc.stop(audioCtx.currentTime + 0.001);
  } catch(e) {}
}
function playNote(f, t, d) {
  if (!audioCtx || f === 0) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d * 0.88);
  o.start(t); o.stop(t + d); melodySources.push(o);
}
function stopMelody() {
  melodySources.forEach(s => { try { s.stop(0); } catch(e) {} });
  melodySources = [];
  if (melodyTimeout) { clearTimeout(melodyTimeout); melodyTimeout = null; }
}
function playMelody(key) {
  if (!audioCtx) return;
  // Always resume if suspended — on iOS, notes scheduled at a future time will
  // play once context transitions to running (don't return early or use .then())
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const m = MELODIES[key]; if (!m) return;
  const bd = 60 / m.bpm;
  let t = audioCtx.currentTime + 0.1;
  m.notes.forEach(([f, d]) => { playNote(f, t, d * bd * 0.88); t += d * bd; });
  const total = m.notes.reduce((s, [,d]) => s + d * bd, 0);
  melodyTimeout = setTimeout(() => playMelody(key), (total - 0.05) * 1000);
}
function playCityMusic(name) { initAudio(); stopMelody(); playMelody(name); }
function playSuccessJingle() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [[N.C5,.08],[N.E5,.08],[N.G5,.08],[N.C5*2,.3]].forEach(([f,d],i) => playNote(f, t+i*.1, d));
}
function playFailJingle() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [[N.G4,.14],[N.Fs4,.14],[N.F4,.14],[N.E4,.3]].forEach(([f,d],i) => playNote(f, t+i*.15, d));
}

// ═══════════════════════════════════════════════════════════════
// TRIVIA — SHUFFLE
// ═══════════════════════════════════════════════════════════════
function shuffleQuestion(q) {
  const items = q.opts.map((opt, i) => ({ opt, correct: i === q.a }));
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return { q: q.q, opts: items.map(s => s.opt), a: items.findIndex(s => s.correct), exp: q.exp };
}

// ── Photo (from Wikipedia) + local tips ───────────────────────
const photoCache = {};
function fetchCityPhoto(city) {
  if (!(city.name in photoCache)) photoCache[city.name] = loadCityPhoto(city);
  return photoCache[city.name];
}
async function loadCityPhoto(city) {
  for (const title of (city.wiki || [])) {
    try {
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.thumbnail || !d.thumbnail.source) continue;
      let src = d.thumbnail.source;
      const o = d.originalimage;
      if (o && o.width > 640) src = src.replace(/\/\d+px-/, '/640px-');
      else if (o && o.source) src = o.source;
      const page = (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || '';
      return { src, page };
    } catch (e) { /* offline or blocked — try next title */ }
  }
  return null;
}
function renderCityExtras(city) {
  const box = document.getElementById('cityPhoto');
  const img = document.getElementById('cityImg');
  const credit = document.getElementById('cityImgCredit');
  box.classList.remove('loaded');
  box.style.display = '';
  img.removeAttribute('src');
  img.alt = city.name;
  fetchCityPhoto(city).then(p => {
    if (activeCity !== city) return;
    if (!p) { box.style.display = 'none'; return; }
    img.onload = () => box.classList.add('loaded');
    img.onerror = () => { box.style.display = 'none'; };
    img.src = p.src;
    credit.href = p.page || 'https://en.wikipedia.org';
  });
  const tips = document.getElementById('cityTips');
  const list = document.getElementById('cityTipsList');
  list.innerHTML = '';
  (city.tips || []).forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    list.appendChild(li);
  });
  tips.style.display = (city.tips && city.tips.length) ? '' : 'none';
  tips.open = false;
}

  document.getElementById('modTitle').textContent = activeCity.name;
  refreshAttractionList(activeCity);
  showScreen('city');
}

// ── Trivia ────────────────────────────────────────────────────
function startTrivia(attr) {
  activeAttr = attr;
  triviaAnswered = false;
  activeQ = shuffleQuestion(attr.trivia[Math.floor(Math.random() * attr.trivia.length)]);

  showScreen('trivia');
  document.getElementById('triviaAttrName').textContent = `🎯 ${attr.name}`;
  document.getElementById('triviaQ').textContent = activeQ.q;

  const optCont = document.getElementById('triviaOptions');
  optCont.innerHTML = '';
  activeQ.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 't-opt';
    btn.textContent = opt;
    btn.onclick = () => answerTrivia(i, btn);
    optCont.appendChild(btn);
  });

  triviaTimeLeft = 20;
  updateTimerUI();
  triviaTimer = setInterval(() => {
    triviaTimeLeft = Math.max(0, triviaTimeLeft - 0.1);
    updateTimerUI();
    if (triviaTimeLeft <= 0) { clearInterval(triviaTimer); triviaTimer = null; answerTrivia(-1, null); }
  }, 100);

  stopMelody();
  playMelody('trivia');
}

function updateTimerUI() {
  const pct = triviaTimeLeft / 20;
  const fill = document.getElementById('triviaTimerFill');
  fill.style.width = (pct * 100) + '%';
  fill.style.background = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ffc107' : '#f44336';
  document.getElementById('triviaTimeNum').textContent = Math.ceil(triviaTimeLeft) + ' שניות';
}

function answerTrivia(chosenIdx, chosenBtn) {
  if (triviaAnswered) return;
  triviaAnswered = true;
  if (triviaTimer) { clearInterval(triviaTimer); triviaTimer = null; }

  document.querySelectorAll('.t-opt').forEach(b => { b.style.pointerEvents = 'none'; });

  const correct = chosenIdx === activeQ.a;
  const timeout = chosenIdx === -1;

  if (!timeout && chosenBtn) chosenBtn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    const opts = document.querySelectorAll('.t-opt');
    if (opts[activeQ.a]) opts[activeQ.a].classList.add('correct');
  }

  const earned = correct
    ? activeAttr.pts + Math.floor((triviaTimeLeft / 20) * activeAttr.pts * 0.5)
    : 0;

  stopMelody();
  if (correct) { playSuccessJingle(); spawnConfetti(); }
  else playFailJingle();

  setTimeout(() => showExplanation(correct, timeout, earned), 1000);
}

function showExplanation(correct, timeout, earned) {
  showScreen('explanation');
  document.getElementById('expIcon').textContent  = correct ? '💡' : '📖';
  document.getElementById('expTitle').textContent = correct ? 'נכון! הנה עוד על הנושא:' : 'הנה התשובה הנכונה:';
  document.getElementById('expText').textContent  = activeQ.exp || '';
  document.getElementById('expBtn').onclick = () => showResult(correct, timeout, earned);
}

function showResult(correct, timeout, earned) {
  activeAttr.done = true;
  if (correct) {
    correctStreak++;
    let streakBonus = 0;
    if (correctStreak >= 3) {
      streakBonus = 10;
      earned += streakBonus;
    }
    score += earned;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('dreamyHighScore', highScore);
    }
    visitLog.unshift(`${activeCity.name} — ${activeAttr.name} +${earned}`);
  } else {
    correctStreak = 0;
    visitLog.unshift(`${activeCity.name} — ${activeAttr.name} +0`);
  }
  if (visitLog.length > 6) visitLog.pop();
  saveGame();

  const streakTxt = correctStreak >= 3 ? ` 🔥×${correctStreak} +10 בונוס!` : '';
  showScreen('result');
  document.getElementById('resultIcon').textContent = correct ? '🎉' : (timeout ? '⏱️' : '❌');
  document.getElementById('resultText').textContent  = correct
    ? `תשובה נכונה!${streakTxt}`
    : (timeout ? 'פג הזמן!' : 'תשובה שגויה...');
  document.getElementById('resultPts').textContent   = correct
    ? `+${earned} נקודות (בונוס מהירות כלול! 🚀)`
    : `0 נקודות — שווה לדעת לפעם הבאה 💡`;

  const btn = document.getElementById('resultBtn');
  const allDone = activeCity.attractions.every(a => a.done);
  if (!allDone) {
    btn.textContent = 'בחרו עוד אטרקציה! 🗺️';
    btn.onclick = continueInCity;
  } else {
    btn.textContent = 'המשיכו לטייל! 🚐';
    btn.onclick = closeModal;
  }

  // Check if all attractions everywhere are done — trigger victory!
  const totalDone = CITIES.reduce((s, c) => s + c.attractions.filter(a => a.done).length, 0);
  const totalAll  = CITIES.reduce((s, c) => s + c.attractions.length, 0);
  if (totalDone === totalAll) setTimeout(showVictory, 1200);
}

document.getElementById('skipBtn').onclick = () => {
  if (activeCity) activeCity.snoozed = true;
  closeModal();
};

function closeModal() {
  if (triviaTimer) { clearInterval(triviaTimer); triviaTimer = null; }
  modal.style.display = 'none';
  modalOpen = false;
  if (activeCity) activeCity.lastClosed = Date.now();
  activeCity = null; activeAttr = null; activeQ = null;
  clickTarget = null;
  canvas.style.cursor = 'crosshair';
  stopMelody();
}

function showVictory() {
  closeModal();
  const totalAttr = CITIES.reduce((s, c) => s + c.attractions.length, 0);
  document.getElementById('victoryScore').textContent = score;
  document.getElementById('victoryAttrs').textContent = `${totalAttr} אטרקציות — שחקנים מדהימים! 🌟`;
  document.getElementById('victoryHigh').textContent =
    score >= highScore ? `🏆 שיא חדש! ${score} נקודות` : `שיא: ${highScore} נקודות`;
  document.getElementById('victory').style.display = 'flex';
  stopMelody();
}

function resetGame() {
  score = 0;
  fuel = 100;
  visitLog.length = 0;
  particles = [];
  CITIES.forEach(c => {
    c.snoozed = false;
    c.lastClosed = 0;
    c.attractions.forEach(a => { a.done = false; });
  });
  caravan.x = -200;
  caravan.y = -200;
  caravan.rotation = 0;
  clickTarget = null;
  travelingTo = null;
  selectingStart = true;
  mapZoom = 1; mapPanX = 0; mapPanY = 0;
  document.getElementById('victory').style.display = 'none';
}

function saveGame() {
  try {
    localStorage.setItem('dreamySave', JSON.stringify({
      score, fuel, correctStreak,
      caravanX: caravan.x, caravanY: caravan.y,
      selectingStart,
      visitLog: [...visitLog],
      cities: CITIES.map(c => ({
        snoozed: c.snoozed || false,
        attractions: c.attractions.map(a => a.done || false)
      }))
    }));
  } catch(e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem('dreamySave');
    if (!raw) return false;
    const s = JSON.parse(raw);
    score = s.score || 0;
    fuel = s.fuel ?? 100;
    correctStreak = s.correctStreak || 0;
    caravan.x = s.caravanX ?? -200;
    caravan.y = s.caravanY ?? -200;
    selectingStart = s.selectingStart ?? true;
    visitLog.length = 0;
    (s.visitLog || []).forEach(v => visitLog.push(v));
    (s.cities || []).forEach((cs, i) => {
      if (!CITIES[i]) return;
      CITIES[i].snoozed = cs.snoozed;
      cs.attractions.forEach((done, j) => {
        if (CITIES[i].attractions[j]) CITIES[i].attractions[j].done = done;
      });
    });
    return true;
  } catch(e) { return false; }
}

document.getElementById('victoryReplay').onclick = () => {
  localStorage.removeItem('dreamySave');
  correctStreak = 0;
  resetGame();
};

// Share score
function shareScore() {
  const txt = `שיחקתי קרוון בישראל וקיבלתי ${score} נקודות! 🚐🇮🇱`;

  }
}
document.getElementById('victoryShare').onclick = shareScore;


function spawnConfetti() {
  const cx = MAP_W / 2, cy = H / 2;
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: cx + (Math.random() - 0.5) * 120,
      y: cy + (Math.random() - 0.5) * 120,
      vx: (Math.random() - 0.5) * 10,
      vy: Math.random() * -12 - 2,
      color: `hsl(${Math.random()*360},90%,60%)`,
      life: 1.0,
      size: 4 + Math.random() * 5
    });
  }
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let portraitMode = false;

function isPortraitMobile() {
  return window.innerWidth < 650 && window.innerWidth < window.innerHeight;
}

function resizeCanvas() {
  portraitMode = isPortraitMobile();
  const modal = document.getElementById('modal');
  if (portraitMode) {
    canvas.width  = MAP_W;
    canvas.height = H + PORTRAIT_PANEL_H;
    modal.style.left = '50%';

    canvas.width  = W;
    canvas.height = H;
    modal.style.left = '33.75%';
    modal.style.top  = '50%';
  }
}
window.addEventListener('resize', resizeCanvas);

// Click-to-move
function handleCanvasClick(tx, ty) {
  if (modalOpen) return;
  initAudio();
  // Convert canvas coords to map-space (accounting for zoom/pan)
  const mapX = (tx - mapPanX) / mapZoom;
  const mapY = (ty - mapPanY) / mapZoom;
  if (selectingStart) {
    // Find nearest city to click and place caravan there
    let best = null, bestDist = Infinity;
    CITIES.forEach(c => {
      const d = Math.hypot(mapX - c.cx, mapY - c.cy);
      if (d < bestDist) { bestDist = d; best = c; }
    });
    if (best && bestDist < 80) {
      caravan.x = best.cx;
      caravan.y = best.cy;
      selectingStart = false;
    }
    return;
  }
  if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= H) return;

  // Detect click near a city → travel animation
  let nearCity = null, nearDist = Infinity;
  CITIES.forEach(c => {
    const d = Math.hypot(mapX - c.cx, mapY - c.cy);
    if (d < 60 && d < nearDist) { nearDist = d; nearCity = c; }
  });
  if (nearCity) {
    travelingTo = nearCity;
    clickTarget = { x: nearCity.cx, y: nearCity.cy };
    // Start city music immediately (iOS requires audio triggered within gesture handler)
    playCityMusic(nearCity.name);
  } else {
    travelingTo = null;
    clickTarget = { x: mapX, y: mapY };
  }
}
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  handleCanvasClick(
    (e.clientX - rect.left) * (canvas.width / rect.width),
    (e.clientY - rect.top)  * (canvas.height / rect.height)
  );
});
// Touch handling — pinch zoom + pan + tap
let _touchState = { lastDist: 0, lastX: 0, lastY: 0, isPinch: false };
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  if (e.touches.length === 2) {
    _touchState.isPinch = true;
    _touchState.lastDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    _touchState.lastX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    _touchState.lastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  } else {
    _touchState.isPinch = false;
    _touchState.lastX = e.touches[0].clientX;
    _touchState.lastY = e.touches[0].clientY;
    // Single tap → click-to-move
    handleCanvasClick(
      (e.touches[0].clientX - rect.left) * (canvas.width / rect.width),
      (e.touches[0].clientY - rect.top)  * (canvas.height / rect.height)
    );
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left) * scaleX;
    const midY = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top) * scaleY;
    const newZoom = Math.max(1, Math.min(4, mapZoom * (dist / _touchState.lastDist)));
    mapPanX = midX - (midX - mapPanX) * (newZoom / mapZoom);
    mapPanY = midY - (midY - mapPanY) * (newZoom / mapZoom);
    mapZoom = newZoom;
    _touchState.lastDist = dist;
  } else if (mapZoom > 1 && !_touchState.isPinch) {
    // Pan with single finger when zoomed
    const dx = (e.touches[0].clientX - _touchState.lastX) * scaleX;
    const dy = (e.touches[0].clientY - _touchState.lastY) * scaleY;
    mapPanX = Math.min(0, Math.max(MAP_W * (1 - mapZoom), mapPanX + dx));
    mapPanY = Math.min(0, Math.max(H * (1 - mapZoom), mapPanY + dy));
    _touchState.lastX = e.touches[0].clientX;
    _touchState.lastY = e.touches[0].clientY;
  }
}, { passive: false });

// Mouse wheel zoom (desktop)
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top)  * (canvas.height / rect.height);
  const newZoom = Math.max(1, Math.min(4, mapZoom * (e.deltaY < 0 ? 1.12 : 0.89)));
  mapPanX = mx - (mx - mapPanX) * (newZoom / mapZoom);
  mapPanY = my - (my - mapPanY) * (newZoom / mapZoom);
  if (newZoom === 1) { mapPanX = 0; mapPanY = 0; }
  mapZoom = newZoom;
}, { passive: false });

function mp(x, y) { return [MX + x, MY + y]; }

const TRAIL_POINTS = [
  [143,22],[118,45],[100,68],[85,95],
  [80,118],[82,148],[85,175],[88,210],
  [90,245],[95,275],[98,310],[100,350],
  [103,390],[108,430],[118,462],[128,492],
];

function drawTrail() {
  ctx.save();
  ctx.setLineDash([5,4]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ff6600aa';
  ctx.beginPath();
  TRAIL_POINTS.forEach(([mx,my],i) => {
    const x = MX+mx, y = MY+my;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='bold 8px Arial';
  ctx.fillStyle='#ff6600bb';
  ctx.textAlign='left';
  ctx.fillText('🥾 שביל ישראל', MX+55, MY+480);

}

// ── Map ──────────────────────────────────────────────────────
function drawMap() {
  ctx.fillStyle = '#1a4a7a';
  ctx.fillRect(0, 0, MAP_W, H);
  const grad = ctx.createLinearGradient(0, MY, 0, MY + 530);
  grad.addColorStop(0,    '#4a7c42');
  grad.addColorStop(0.45, '#7a8c3a');
  grad.addColorStop(0.72, '#b89040');
  grad.addColorStop(1,    '#c49a30');
  ctx.beginPath();
  const [sx, sy] = mp(ISRAEL[0][0], ISRAEL[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < ISRAEL.length; i++) {
    const [px, py] = mp(ISRAEL[i][0], ISRAEL[i][1]);
    ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#2d5a28'; ctx.lineWidth = 2; ctx.stroke();
  drawTrail();
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.textAlign = 'center';
  ctx.fillText('N ↑', MX + 100, MY + 13);
}

// ── Cities ───────────────────────────────────────────────────
function drawCities() {
  const now = Date.now();
  CITIES.forEach(c => {
    const { cx, cy, color, name, attractions } = c;
    const doneCount = attractions.filter(a => a.done).length;
    const allDone = doneCount === attractions.length;
    const anyDone = doneCount > 0;

    // Pulsing ring
    if (allDone) {
      // Gold glow for completed cities
      const pulse = 0.5 + 0.5 * Math.sin(now / 1000 + cx * 0.05);
      ctx.beginPath();
      ctx.arc(cx, cy, 13 + pulse * 5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,215,0,${0.3 + pulse * 0.4})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    } else {
      const pulse = 0.5 + 0.5 * Math.sin(now / 600 + cx * 0.05);
      ctx.beginPath();
      ctx.arc(cx, cy, 14 + pulse * 4, 0, Math.PI * 2);
      ctx.strokeStyle = color + (anyDone ? '88' : '55');
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fillStyle = allDone ? 'rgba(255,215,0,.35)' : (anyDone ? color + '66' : color + '44');
    ctx.fill();
    ctx.strokeStyle = allDone ? '#ffd700' : color;
    ctx.lineWidth = allDone ? 2.5 : 2;
    ctx.stroke();

    ctx.font = '13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.emoji, cx, cy);
    ctx.textBaseline = 'alphabetic';

    // Status badge
    ctx.font = allDone ? '14px Arial' : '11px Arial';
    ctx.textAlign = 'center';
    if (allDone) ctx.fillText('✅', cx, cy - 17);
    else if (anyDone) ctx.fillText('☆', cx, cy - 14);

    // Remaining badge
    const remaining = attractions.length - doneCount;
    if (anyDone && !allDone && remaining > 0) {
      ctx.beginPath();
      ctx.arc(cx + 11, cy - 10, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#ff7700';
      ctx.fill();
      ctx.font = 'bold 9px Arial';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(remaining, cx + 11, cy - 7);
    }

    // Fuel station indicator
    if (FUEL_STATIONS.has(c.name)) {
      ctx.font = '9px Arial'; ctx.textAlign = 'left'; ctx.fillStyle = '#ffa000';
      ctx.fillText('⛽', cx + 11, cy + 2);
    }

    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
    ctx.fillText(name, cx, cy + 20);
    ctx.shadowBlur = 0;
  });
}

function drawCaravan() {

// ═══════════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════════
function update() {
  if (modalOpen) return;

  let dx = 0, dy = 0;
  const baseSpd = caravan.speed * frameScale;  // same speed on 60Hz and 120Hz screens
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= baseSpd;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += baseSpd;
  if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= baseSpd;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += baseSpd;

  // Click-to-move (faster when traveling to a city)
  if (clickTarget && dx === 0 && dy === 0) {
    const cdx = clickTarget.x - caravan.x;
    const cdy = clickTarget.y - caravan.y;
    const dist = Math.hypot(cdx, cdy);
    const spd = travelingTo ? baseSpd * 0.85 : baseSpd;
    const arriveRadius = travelingTo ? 12 : 6;
    if (dist < arriveRadius) {
      clickTarget = null;
      if (travelingTo) {
        const dest = travelingTo;
        travelingTo = null;
        openModal(dest);
      }
    } else {
      dx += (cdx / dist) * Math.min(spd, dist);
      dy += (cdy / dist) * Math.min(spd, dist);
      // Dust particles during travel
      if (Math.random() < 0.5) {
        particles.push({
          x: caravan.x + (Math.random() - 0.5) * 14,
          y: caravan.y + 18,
          vx: -dx * 0.3 + (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          color: `hsl(${30 + Math.random()*20},75%,65%)`,
          life: 0.7, size: 2 + Math.random() * 3
        });
      }
    }
  }

  // Consume fuel while moving
  const movedForFuel = Math.hypot(dx, dy);
  if (movedForFuel > 0) {
    fuel = Math.max(0, fuel - movedForFuel / 30);
    if (fuel === 0) { dx = 0; dy = 0; }
  }

  if (dx !== 0) caravan.facing = dx > 0 ? 1 : -1;
  caravan.moving = dx !== 0 || dy !== 0;

  // Bounce
  if (caravan.moving) caravan.bounceT += 0.3;
  else caravan.bounceT *= 0.85;

  // Rolling rotation — sticker spins as it rolls
  const moved = Math.hypot(dx, dy);
  if (moved > 0) {
    const dir = dx !== 0 ? Math.sign(dx) : caravan.facing;
    caravan.rotation += dir * moved * 0.025;
  }

  caravan.x = Math.max(80, Math.min(MAP_W - 30, caravan.x + dx));
  caravan.y = Math.max(40, Math.min(H - 40, caravan.y + dy));

  // Un-snooze when moved away
  CITIES.forEach(c => {
    if (c.snoozed && Math.hypot(caravan.x - c.cx, caravan.y - c.cy) > 70) c.snoozed = false;
  });

  // Proximity check — only during keyboard movement (not during any click navigation)
  if (!travelingTo && !clickTarget) {
    for (const city of CITIES) {
      if (city.snoozed) continue;
      if (city.lastClosed && Date.now() - city.lastClosed < 3000) continue;
      const anyLeft = city.attractions.some(a => !a.done);
      if (!anyLeft) continue;
      if (Math.hypot(caravan.x - city.cx, caravan.y - city.cy) < 28) {
        openModal(city);
        break;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
let lastFrameT = 0, frameScale = 1;
function loop(now) {
  now = typeof now === 'number' ? now : performance.now();
  frameScale = lastFrameT ? Math.min(3, (now - lastFrameT) / (1000 / 60)) : 1;
  lastFrameT = now;
  if (!selectingStart) update();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // MAP area — apply zoom/pan transform, clipped to map region
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, MAP_W, H); ctx.clip();
  ctx.translate(mapPanX, mapPanY);
  ctx.scale(mapZoom, mapZoom);
  drawMap();
  drawClickTarget();
  drawCities();
  if (!selectingStart) drawCaravan();
  // Confetti particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // Panel — no zoom
  if (portraitMode) drawPanelPortrait(); else drawPanel();

  // Fuel warning: red pulsing border
  if (fuel < 20 && fuel > 0) {
    const alpha = 0.25 + 0.55 * Math.abs(Math.sin(Date.now() / 350));
    ctx.save();
    ctx.strokeStyle = `rgba(244,67,54,${alpha})`;
    ctx.lineWidth = 9;
    ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
    ctx.restore();
  }

  // Fuel empty: arrow pointing to nearest fuel station
  if (fuel <= 0) {
    let nearestStation = null, nearestDist = Infinity;
    CITIES.forEach(c => {
      if (FUEL_STATIONS.has(c.name)) {
        const d = Math.hypot(caravan.x - c.cx, caravan.y - c.cy);
        if (d < nearestDist) { nearestDist = d; nearestStation = c; }
      }
    });
    if (nearestStation) {
      ctx.save();
      const ang = Math.atan2(nearestStation.cy - caravan.y, nearestStation.cx - caravan.x);
      const pulse = 0.7 + 0.3 * Math.abs(Math.sin(Date.now() / 400));
      // Arrow base at caravan
      const ax = caravan.x, ay = caravan.y;
      const arrowLen = 36 * pulse;
      const tx2 = ax + Math.cos(ang) * arrowLen, ty2 = ay + Math.sin(ang) * arrowLen;
      ctx.strokeStyle = '#ff5722';
      ctx.fillStyle = '#ff5722';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(tx2, ty2); ctx.stroke();
      // Arrowhead
      ctx.translate(tx2, ty2);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-10, -5); ctx.lineTo(-10, 5); ctx.closePath();
      ctx.fill();
      ctx.restore();
      // Label
      ctx.save();
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      const lbl = `⛽ ${nearestStation.name}`;
      const lw = ctx.measureText(lbl).width;
      const lx = Math.min(MAP_W - lw / 2 - 8, Math.max(lw / 2 + 8, ax + Math.cos(ang) * 55));
      const ly = Math.min(H - 20, Math.max(20, ay + Math.sin(ang) * 55));
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath(); ctx.roundRect(lx - lw / 2 - 6, ly - 14, lw + 12, 20, 5); ctx.fill();
      ctx.fillStyle = '#ff9800';
      ctx.fillText(lbl, lx, ly);
      ctx.restore();
    }
  }

  // Travel indicator
  if (travelingTo) {
    ctx.save();
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'center';
    const label = `✈️ נוסעים ל: ${travelingTo.emoji || ''} ${travelingTo.name}`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.roundRect(MAP_W / 2 - tw / 2 - 12, 10, tw + 24, 32, 8);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.fillText(label, MAP_W / 2, 31);
    ctx.restore();
  }

  // Start-city selection overlay (map area only)
  if (selectingStart) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.50)';
    ctx.fillRect(0, 0, MAP_W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🏠 בחרו עיר להתחלה', MAP_W / 2, H / 2 - 10);
    ctx.font = '14px Arial';
    ctx.fillStyle = '#aad4ff';
    ctx.fillText('לחצו על כל עיר במפה', MAP_W / 2, H / 2 + 20);
    ctx.restore();
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.018; });
  particles = particles.filter(p => p.life > 0);

  requestAnimationFrame(loop);
}

loadGame(); // Restore previous session if any
resizeCanvas(); // Set correct canvas size before first frame
if (caravanImg.complete && caravanImg.naturalWidth > 0) loop();
else { caravanImg.onload = loop; caravanImg.onerror = loop; }
</script>
</body>
